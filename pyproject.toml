[project]
name = "cyberplatform"
version = "0.1.0"
description = "Prototype de plateforme cyber IA pour detection et priorisation d'incidents."
requires-python = ">=3.10"
dependencies = [
  "joblib",
  "numpy",
  "pandas",
  "plotly",
  "scikit-learn",
  "streamlit",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

